
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRN Beauty | Aesthetic Operation Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #fdf5f2;
            overflow-x: hidden;
            color: #0f172a; /* Slate 900 for general sharpness */
        }
        .serif { font-family: 'Playfair Display', serif; }
        .glass {
            background: rgba(255, 255, 255, 0.55); /* Increased opacity from 0.25 */
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }
        .bg-cream-silk {
            background: radial-gradient(circle at 50% 50%, #fdf5f2 0%, #f8ebe6 70%, #efe0da 100%);
        }
        @keyframes flow {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-10px, 15px) scale(1.05); }
            100% { transform: translate(0, 0) scale(1); }
        }
        .animate-flow {
            animation: flow 12s ease-in-out infinite;
        }
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* High Visibility Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #E5B4A1; border-radius: 10px; }

        /* Aura Styles */
        .aura-gold {
            border: 2px solid #D49680 !important;
            box-shadow: 0 0 30px rgba(212, 150, 128, 0.3);
        }
        .aura-red {
            border: 2px solid #E11D48 !important;
            box-shadow: 0 0 25px rgba(225, 29, 72, 0.2);
        }
    </style>
<script type="importmap">

}
</script>
</head>

</body>
</html>
